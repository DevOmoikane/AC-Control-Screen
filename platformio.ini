; One project, two independent firmwares.
; Build: pio run -e ir_node / pio run -e cyd_remote
; Upload: pio run -e ir_node -t upload / pio run -e cyd_remote -t upload
;
; Uses the PlatformIO espressif32 6.x Arduino 2.x / ESP-IDF 4.x toolchain,
; which provides the legacy RMT API used in the IR node.

[platformio]
default_envs = ir_node, cyd_remote

[env]
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1

[env:ir_node]
board = esp32-c3-devkitm-1
build_src_filter = +<ir_node.cpp> -<cyd_remote.cpp>
build_flags =
    ${env.build_flags}
    ; PlatformIO's board manifest has no build.usb_mode, so it never passes
    ; ARDUINO_USB_MODE. Without it HWCDC.h skips its `extern HWCDC Serial`
    ; block, USBCDC.h is inert (CONFIG_TINYUSB_CDC_ENABLED is unset in this
    ; SDK), and HardwareSerial.cpp's serialEventRun() references an
    ; undefined `Serial`. 1 = built-in USB Serial/JTAG, correct for C3.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:cyd_remote]
board = esp32dev
; src/ui/ holds the EEZ Studio generated UI.
build_src_filter = +<cyd_remote.cpp> +<ui/> -<ir_node.cpp>
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    ; Registry entry for this library only carries a 2019 alpha
    ; (0.0.0-alpha+sha.26b691b2c8), and there is no 1.4.0 tag upstream --
    ; the tag is v1.4. Pin the repo tag directly.
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
    knolleary/PubSubClient@^2.8
    ; Must match the EEZ project's LVGL version exactly (9.4.0), not a range.
    lvgl/lvgl@9.4.0
build_flags =
    ${env.build_flags}
    ; LVGL picks up include/lv_conf.h with this define. The include path has
    ; to be given explicitly: PlatformIO's own -Iinclude only reaches the
    ; project sources, not the LVGL library sources, and LVGL's
    ; __has_include based lookup then silently skips the include.
    -DLV_CONF_INCLUDE_SIMPLE
    -I$PROJECT_DIR/include
    -DUSER_SETUP_LOADED=1
    ; The ILI9341 on this CYD has inverted colour polarity: without this the
    ; dark UI is drawn as a white background with black text.
    -DTFT_INVERSION_ON
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DUSE_HSPI_PORT=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
